<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px;
        }
        .dashboard-container {
            max-width: 600px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-block {
            display: block;
            width: 100%;
            margin-bottom: 15px;
        }
        #result {
            margin-top: 20px;
            font-weight: bold;
            color: #0d6efd;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <h1>Dashboard</h1>
    <p class="text-center">Click the buttons below to test the API endpoints:</p>

    <button class="btn btn-primary btn-block" onclick="callApi('test1')">Test Endpoint 1 (ADMIN)</button>
    <button class="btn btn-success btn-block" onclick="callApi('test2')">Test Endpoint 2 (USER)</button>
    <button class="btn btn-info btn-block" onclick="callApi('test3')">Test Endpoint 3 (USER)</button>

    <div id="result"></div>

    <button class="btn btn-danger btn-block mt-3" onclick="logout()">Logout</button>
</div>
<!-- Bootstrap 5 JS Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Add jQuery here -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


<script>
    function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }

    function deleteCookie(name) {
        document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

    window.onload = function () {
        const token = getCookie("token");
        if (!token) {
            window.location.href = "login.html";
        }
    };

    function logout() {
        deleteCookie("token");
        deleteCookie("username");
        console.log("User logged out");
        window.location.href = 'login.html';
    }
</script>
</body>
</html>
